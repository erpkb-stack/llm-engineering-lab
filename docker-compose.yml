# Default: app with SQLite (simulation mode)        →  docker compose up --build
# With PostgreSQL:                                   →  docker compose --profile postgres up --build
# With a local Ollama model server:                  →  docker compose --profile ollama up --build
services:
  app:
    build:
      context: .
      args:
        WITH_ML: "${WITH_ML:-0}"
    image: llm-engineering-lab:latest
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      LLMLAB_DATABASE_URL: "${LLMLAB_DATABASE_URL:-sqlite+aiosqlite:////app/data/llmlab.db}"
      LLMLAB_OLLAMA_BASE_URL: "${LLMLAB_OLLAMA_BASE_URL:-http://ollama:11434}"
      LLMLAB_ADAPTERS_DIR: /app/data/adapters
    volumes:
      - lab-data:/app/data
    restart: unless-stopped

  postgres:
    profiles: ["postgres"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: llmlab
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-llmlab-dev-only}"
      POSTGRES_DB: llmlab
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmlab"]
      interval: 5s
      retries: 10

  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  lab-data:
  pg-data:
  ollama-data:
