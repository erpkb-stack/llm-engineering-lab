    <path d="M27 20.5v3M32 20.5v3M37 20.5v3M27 40.5v3M32 40.5v3M37 40.5v3M20.5 27h3M20.5 32h3M20.5 37h3M40.5 27h3M40.5 32h3M40.5 37h3"/>
