  <!-- orbit nodes (accent palette) -->
  <circle cx="32" cy="11" r="3.6" fill="#00CEB3"/>
  <circle cx="53" cy="32" r="3.6" fill="#FBB130"/>
  <circle cx="32" cy="53" r="3.6" fill="#FC787D"/>
