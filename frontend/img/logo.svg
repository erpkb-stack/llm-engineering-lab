  <path d="M28 28.2L36 28.2L32 35.6Z" fill="none" stroke="#714B67" stroke-width="1.5" stroke-linejoin="round"/>
  <g fill="#714B67">
    <circle cx="28" cy="28.2" r="2.1"/><circle cx="36" cy="28.2" r="2.1"/><circle cx="32" cy="35.6" r="2.1"/>
