# Production deployment on a shared Docker host behind an existing Caddy reverse proxy.
#
#   docker compose -f deploy/docker-compose.server.yml --env-file .env up -d --build
#
# - No host ports are published; the host's Caddy terminates TLS and proxies to llmlab-app:8000.
# - The service name is prefixed so it cannot collide with other apps' DNS names on the proxy network.
# - SQLite, uploads and adapters persist in the llmlab_data volume.

name: llmlab

services:
  llmlab-app:
    build:
      context: ..
      args:
        WITH_ML: "0"
    env_file: ../.env
    environment:
      LLMLAB_ENVIRONMENT: production
      LLMLAB_COOKIE_SECURE: "true"
      LLMLAB_DATABASE_URL: sqlite+aiosqlite:////app/data/llmlab.db
      LLMLAB_ADAPTERS_DIR: /app/data/adapters
    volumes:
      - llmlab_data:/app/data
    networks: [proxy]
    mem_limit: 1g
    restart: unless-stopped

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-aiecc_default}

volumes:
  llmlab_data:
